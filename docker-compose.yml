services:
  mysql:
    image: mysql:8.4
    container_name: idol-showdown-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-idol_root_password}
      MYSQL_DATABASE: ${DB_NAME:-idol_showdown_wiki}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - idol_showdown_mysql_data:/var/lib/mysql
      - ./database/schema/001_initial_schema.sql:/docker-entrypoint-initdb.d/01-db-setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  idol_showdown_mysql_data:
