<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5h" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071224" />
      <stop offset="100%" stop-color="#0d233a" />
    </linearGradient>
    <pattern id="grid5h" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="480" height="320" fill="url(#bgGrad5h)"/>
  <rect width="480" height="320" fill="url(#grid5h)"/>

  <line x1="20" y1="270" x2="460" y2="270" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="4 4" />
  <text x="30" y="295" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600">GROUND LEVEL</text>
  <text x="440" y="35" text-anchor="end" fill="#f59e0b" font-family="sans-serif" font-size="12" font-weight="700">DISJOINT HITBOX (FRAME 11-15)</text>

  <!-- Character Silhouette -->
  <g opacity="0.45">
    <ellipse cx="140" cy="115" rx="22" ry="24" fill="#94a3b8"/>
    <rect x="125" y="135" width="40" height="70" rx="10" fill="#94a3b8"/>
    <rect x="115" y="195" width="22" height="75" rx="8" fill="#64748b"/>
    <rect x="145" y="195" width="22" height="75" rx="8" fill="#94a3b8"/>
    <!-- Giant Syringe / Laser Silhouette -->
    <rect x="165" y="145" width="220" height="22" rx="6" fill="#cbd5e1"/>
    <polygon points="385,140 435,156 385,172" fill="#93c5fd"/>
  </g>

  <!-- Pushbox (Blue) -->
  <rect x="110" y="110" width="70" height="160" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2 2" rx="4"/>

  <!-- Hurtbox (Green - Stays back, no hurtbox on weapon tip = Disjoint!) -->
  <rect x="118" y="95" width="56" height="175" fill="rgba(34, 197, 94, 0.22)" stroke="#22c55e" stroke-width="2" rx="4"/>
  <rect x="165" y="140" width="75" height="32" fill="rgba(34, 197, 94, 0.22)" stroke="#22c55e" stroke-width="2" rx="4"/>

  <!-- Hitbox (Red - Giant extended attack box) -->
  <rect x="235" y="130" width="205" height="52" fill="rgba(239, 68, 68, 0.45)" stroke="#ef4444" stroke-width="2.5" rx="6"/>

  <!-- Legend Badges -->
  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="12" height="12" fill="#ef4444" rx="2"/>
    <text x="18" y="10" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="700">Hitbox (Disjoint)</text>

    <rect x="120" y="0" width="12" height="12" fill="#22c55e" rx="2"/>
    <text x="138" y="10" fill="#86efac" font-family="sans-serif" font-size="11" font-weight="700">Hurtbox (Body)</text>

    <rect x="230" y="0" width="12" height="12" fill="#38bdf8" rx="2"/>
    <text x="248" y="10" fill="#bae6fd" font-family="sans-serif" font-size="11" font-weight="700">Pushbox</text>
  </g>
</svg>
