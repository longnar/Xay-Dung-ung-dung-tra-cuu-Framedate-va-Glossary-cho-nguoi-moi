<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071224" />
      <stop offset="100%" stop-color="#0d233a" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="480" height="320" fill="url(#bgGrad)"/>
  <rect width="480" height="320" fill="url(#grid)"/>

  <!-- Ground Line -->
  <line x1="20" y1="270" x2="460" y2="270" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="4 4" />
  <text x="30" y="295" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600">GROUND LEVEL</text>
  <text x="440" y="35" text-anchor="end" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">FRAME 5 (ACTIVE)</text>

  <!-- Character Silhouette (Stylized) -->
  <g opacity="0.45">
    <ellipse cx="190" cy="115" rx="22" ry="24" fill="#94a3b8"/>
    <rect x="175" y="135" width="36" height="70" rx="10" fill="#94a3b8"/>
    <!-- Back leg -->
    <rect x="165" y="195" width="20" height="75" rx="8" fill="#64748b"/>
    <!-- Lead leg -->
    <rect x="195" y="195" width="22" height="75" rx="8" fill="#94a3b8"/>
    <!-- Extended Arm (Punching) -->
    <rect x="200" y="140" width="85" height="18" rx="8" fill="#cbd5e1"/>
  </g>

  <!-- Pushbox (Blue) -->
  <rect x="160" y="110" width="70" height="160" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2 2" rx="4"/>

  <!-- Hurtbox (Green - Body) -->
  <rect x="168" y="95" width="50" height="175" fill="rgba(34, 197, 94, 0.22)" stroke="#22c55e" stroke-width="2" rx="4"/>
  <!-- Hurtbox (Green - Extended Arm) -->
  <rect x="210" y="136" width="60" height="26" fill="rgba(34, 197, 94, 0.22)" stroke="#22c55e" stroke-width="2" rx="4"/>

  <!-- Hitbox (Red - Active Strike) -->
  <rect x="250" y="130" width="68" height="38" fill="rgba(239, 68, 68, 0.45)" stroke="#ef4444" stroke-width="2.5" rx="6"/>

  <!-- Legend Badges -->
  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="12" height="12" fill="#ef4444" rx="2"/>
    <text x="18" y="10" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="700">Hitbox (Strike)</text>

    <rect x="110" y="0" width="12" height="12" fill="#22c55e" rx="2"/>
    <text x="128" y="10" fill="#86efac" font-family="sans-serif" font-size="11" font-weight="700">Hurtbox (Body)</text>

    <rect x="220" y="0" width="12" height="12" fill="#38bdf8" rx="2"/>
    <text x="238" y="10" fill="#bae6fd" font-family="sans-serif" font-size="11" font-weight="700">Pushbox</text>
  </g>
</svg>
