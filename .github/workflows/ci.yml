name: CI Pipeline

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build NestJS Backend
        run: npm run build:nestjs

      - name: Build Vite Frontend
        run: npm run build

      - name: Run Automated Unit Tests
        run: npm test
